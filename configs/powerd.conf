# exper-powerd ayarlari (anahtar=deger). Zaman: ms / sn.
# Guc tusu: bu kadar basili tutulursa kapat; daha kisa basis = ekrani ac/kapat
long_press_ms=3000
# Harici guc (arac kontagi) gidince: bu kadar sn sonra ekrani kapat
loss_screen_off_s=15
# ... bu kadar sn sonra tableti kapat (pil korumasi)
loss_poweroff_s=300
# Pil bu yuzdenin altinda ve sarj olmuyorsa kapat
low_batt_pct=5
# Bosta (dokunma yok VE Android Auto oturumu yok): bu kadar sn sonra arka isigi kis, sonra kapat (0 = kapali).
# Dokunma / guc tusu / telefon baglantisi ekrani geri acar. Oturum surerken hic kisilmaz.
idle_dim_s=60
idle_off_s=180
# Kisilmis parlaklik, yuzde
idle_dim_pct=30
